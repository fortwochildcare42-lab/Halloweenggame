const WH=[["ghost","I am white.","I can fly, but I have no legs.","I say Boo!"],["bat","I have wings.","I sleep all day.","I fly at night."],["witch","I wear a black hat.","I have a black cat.","I fly on a broom."],["spider","I have eight legs.","I live in a web.","I am small and black."],["pumpkin","I am round.","I am orange.","People make my face at Halloween."],["skeleton","I have no skin.","I have many bones.","I am white and I dance."],["dragon","I am very big.","I have wings and a long tail.","I breathe fire."],["cat","I have four legs.","I say meow.","I am black and I live with a witch."]];
function spot(i){let r=0;const nx=()=>{if(r>=SP.length)return fin(i,SP.length,SP.length);const[ti,tg,ss]=SP[r];let left=0;
A.innerHTML=`<h2>🕵️ Spot the Words! ${r+1} / ${SP.length}</h2><p>👇 ${ti} をタップしよう！</p><div class=chat>${ss.map(x=>`<div class=sn>${x.split(' ').map(t=>{const h=tg.includes(t.replace(/[^A-Za-z]/g,'').toLowerCase());if(h)left++;return`<button class=tk data-h=${h?1:0}>${t}</button>`}).join(' ')}</div>`).join('')}</div><p id=sm></p>`;
on('.tk',e=>{if(e.dataset.d)return;const c=e.textContent.replace(/[^A-Za-z]/g,'');if(e.dataset.h==1){e.dataset.d=1;e.classList.add('ok');say(c);add(1);if(--left==0){$('#sm').textContent='🎉 All found! Amazing!';setTimeout(()=>{r++;nx()},1600)}}else{e.classList.add('ng');setTimeout(()=>e.classList.remove('ng'),500)}})};nx()}
function who(i){const qs=sh(WH).slice(0,4);let n=0;const nx=()=>{if(n>=4)return fin(i,4,4);const q=qs[n],t=W.find(x=>x[0]==q[0]);let c=1;
const rd=()=>{A.innerHTML=`<h2>🤔 Who Am I? ${n+1} / 4</h2><p>ヒントをきいて、なんのことかあてよう！</p><div class=chat>${q.slice(1,c+1).map(x=>`<div class=bb>🔍 ${x}</div>`).join('')}</div><button class=btn id=nc ${c>=3?'disabled style="opacity:.4"':''}>Next Clue 💡</button><button class=btn id=sa>Show Answer ✅</button>`;say(q[c]);
$('#nc').onclick=()=>{if(c<3){c++;rd()}};$('#sa').onclick=()=>{add(4-c);A.innerHTML=`<h2>🤔 ${n+1} / 4</h2><div class=big>${t[1]}</div><h2>${t[0]}</h2><p>${t[2]}</p><button class=btn id=nx>Next ▶</button>`;say('It is a '+t[0]+'!');$('#nx').onclick=()=>{n++;nx()}}};rd()};nx()}
const bub=(l,me)=>`<div class="bb ${l[0]}${me?' me':''}">${l[0]=='H'?'🧑':'🧒'} ${l[1]}<small>${l[2]}</small></div>`,sc2=()=>setTimeout(()=>scrollTo(0,document.body.scrollHeight),50);
function rpmenu(i){A.innerHTML=`<h2>💬 Role Play</h2><p>えいかいわをれんしゅう！ 3つのばめん</p><div class=grid>${RP.map((r,k)=>`<button class="tile ${RD.has(k)?'d':''}"><span>${r[0]}</span><b>${r[1]}</b><small>${r[2]}</small></button>`).join('')}</div>`;on('.tile',(e,k)=>rpplay(i,k))}
function rpplay(i,k){const L=RP[k][3];let n=0,log='';const shw=x=>{A.innerHTML=`<h2>${RP[k][0]} ${RP[k][1]}</h2><p>${n+1} / ${L.length}</p><div class=chat>${log}</div>${x}`;sc2()};
const nx=()=>{if(n>=L.length){RD.add(k);if(RD.size==RP.length)D.add(i);add(3);return rpread(i,k,'Y')}const l=L[n];let m=0;
if(l[0]=='H'){log+=bub(l);shw('<button class=btn id=nx>Next ▶</button><button class=snd id=pl>🔊</button>');say(l[1]);$('#nx').onclick=()=>{n++;nx()};$('#pl').onclick=()=>say(l[1])}
else{const pv=n?L[n-1][1]:'';shw(`<p>🧒 あなたのばん！ なんてこたえる？</p>${pv?'<button class=snd id=pl>🔊 Listen again</button>':''}<div class=opts>${sh([l[1],l[3],l[4]]).map(x=>`<button class=opt>${x}</button>`).join('')}</div>`);if(pv)$('#pl').onclick=()=>say(pv);
on('.opt',e=>{if(e.textContent==l[1]){if(!m)add(1);e.classList.add('ok');say(l[1]);log+=bub(l);setTimeout(()=>{n++;nx()},1400)}else{m=1;e.classList.add('ng')}})}};nx()}
function rpread(i,k,role){const L=RP[k][3];let n=0,log='';const nx=()=>{if(n>=L.length){A.innerHTML=`<div class=big>🎉</div><h2>Great Job!</h2><p>いっしょにれんしゅう かんりょう！</p><button class=btn id=sw>🔄 Swap roles</button><button class=btn id=mn>📋 Menu</button>`;say('Great job!');$('#sw').onclick=()=>rpread(i,k,role=='Y'?'H':'Y');$('#mn').onclick=()=>rpmenu(i);return}
const l=L[n],me=l[0]==role;log+=bub(l,me);
A.innerHTML=`<h2>${RP[k][1]}</h2><p>${role=='Y'?'🧒 You are Role A':'🧑 You are Role B'} · ${n+1} / ${L.length} · せんせいとれんしゅう！</p><div class=chat>${log}</div>${me?'<p style="font-size:26px">🎤 Your turn! いってみよう！</p><button class=snd id=pl>🔊 Model</button> ':''}<button class=btn id=nx>Next ▶</button>`;sc2();
if(!me)say(l[1]);$('#nx').onclick=()=>{n++;nx()};if(me)$('#pl').onclick=()=>say(l[1])};nx()}
home();
</script></body></html>
